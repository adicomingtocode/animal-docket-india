<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Who Decides for Animals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Editorial and calm: white page, warm cream bands, one deep-teal accent, serif headings, hairline rows instead of cards. Single light theme by the reader's request. */
:root {
  --bg: #ffffff;
  --cream: #f7f4ee;
  --line: #e5e1d8;
  --line-2: #d6d1c6;
  --ink: #1b1d1f;
  --muted: #5a5f66;
  --accent: #0f6466;
  --accent-dk: #0a4c4e;
  --accent-soft: #e6f0ef;
  --warn: #9a3412;
  --good: #166534;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  --gutr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--accent-dk); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; margin: 0; color: var(--ink); }
h1 { font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.05; }
h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); line-height: 1.12; }
h3 { font-size: 1.28rem; line-height: 1.25; }
p { margin: 0; }
ul { margin: 0; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: var(--gut); padding-right: var(--gutr); }
.narrow { max-width: 720px; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }
.tiny { font-size: 0.82rem; }
.num { font-variant-numeric: tabular-nums; }
.kicker { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 60; background: var(--ink); color: #fff; padding: 8px 12px; border: 0; border-radius: 4px; }
.skip:focus { top: 12px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(255,255,255,0.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 60px; }
.brand { font-family: var(--display); font-size: 1.2rem; font-weight: 600; background: none; border: 0; padding: 0; white-space: nowrap; }
.nav { display: flex; align-items: center; gap: 2px; margin-left: auto; min-width: 0; }
.nav .lnk { background: none; border: 0; padding: 8px 10px; font-size: 0.93rem; color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; }
.nav .lnk:hover { color: var(--ink); }
.nav .lnk[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

/* buttons */
.btn { white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: 1px solid var(--accent); padding: 10px 16px; border-radius: 4px; font-weight: 500; font-size: 0.95rem; text-decoration: none; line-height: 1.2; }
.btn:hover { background: var(--accent-dk); border-color: var(--accent-dk); color: #fff; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); color: var(--accent-dk); }
.btn.sm { padding: 7px 12px; font-size: 0.88rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.more { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.more:hover { color: var(--accent-dk); }
.arrow::after { content: " →"; }

/* segmented choices */
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { background: #fff; border: 1px solid var(--line-2); padding: 9px 14px; border-radius: 4px; font-size: 0.95rem; }
.seg button:hover { border-color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.filters { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.filters button { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 0.95rem; border-bottom: 2px solid transparent; }
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }

/* bands */
.band { padding-block: 64px; }
.band.cream { background: var(--cream); }
.band + .band:not(.cream) { border-top: 1px solid var(--line); }
.head { display: grid; gap: 12px; margin-bottom: 32px; max-width: 720px; }
.lede { font-size: 1.18rem; line-height: 1.55; color: var(--muted); max-width: 640px; }

/* hero */
.hero { padding-block: 72px 48px; }
.hero h1 { max-width: 15ch; }
.hero .lede { margin-top: 18px; }
.pickrow { display: grid; gap: 10px; margin-top: 36px; }
.pickrow + .pickrow { margin-top: 22px; }
.pickrow > .kicker { margin-bottom: 2px; }

/* ranked rows (the core pattern) */
.rows { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 18px; padding: 22px 0; border-bottom: 1px solid var(--line); align-items: start; }
.row .rk { font-family: var(--display); font-size: 1.35rem; color: var(--muted); line-height: 1.25; font-variant-numeric: tabular-nums; }
.row h3 { font-size: 1.32rem; }
.row h3 button, .row h3 a { background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; text-decoration: none; }
.row h3 button:hover, .row h3 a:hover { color: var(--accent); }
.row .ln { color: var(--muted); margin-top: 4px; max-width: 62ch; }
.row .meta { margin-top: 8px; font-size: 0.86rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.row .meta b { font-weight: 500; color: var(--ink); }
.row .go { align-self: center; }
.row.clickable { cursor: pointer; }
.row.clickable:hover h3 { color: var(--accent); }
.row.compact { grid-template-columns: minmax(0, 1fr) auto; padding: 16px 0; }
.who-on { color: var(--good); font-weight: 500; }
.prio-High { color: var(--warn); font-weight: 500; }
figure.ph { margin: 0; position: relative; overflow: hidden; background: var(--cream); border-radius: 6px; max-width: 100%; }
figure.ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
figure.ph figcaption { position: absolute; right: 8px; bottom: 8px; font-size: 11.5px; line-height: 1; padding: 5px 7px; border-radius: 3px; background: rgba(20,24,22,.62); color: #fff; }
figure.ph figcaption a { color: #fff; text-decoration: none; }
.ph-hero { aspect-ratio: 3/1; margin-top: 32px; }
.ph-state { aspect-ratio: 21/7; margin-top: 28px; }
.ph-sheet { aspect-ratio: 16/7; margin: 16px 0 4px; }
.credits { padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.credits b { display: block; color: var(--ink); margin-bottom: 4px; }
@media (max-width: 760px) { .ph-hero, .ph-state { aspect-ratio: 16/9; } }
.bk-low { color: var(--good); font-weight: 500; } .bk-med { color: #8a5a00; font-weight: 500; } .bk-high { color: var(--warn); font-weight: 500; }
.bkbox { margin-top: 18px; padding: 14px 16px; border-radius: 4px; font-size: 0.94rem; }
.bkbox b { display: block; margin-bottom: 2px; }
.bkbox.low { background: #ecf6ef; } .bkbox.med { background: #fbf3e0; } .bkbox.high { background: #fbeae4; }
.bkhead { margin-top: 30px; } .bkhead:first-child { margin-top: 0; }
.bkhead h3 { font-size: 1.15rem; } .bkhead p { color: var(--muted); font-size: 0.92rem; margin-top: 2px; }
details.risky > summary { cursor: pointer; list-style: none; padding: 14px 0; color: var(--accent); font-weight: 500; }
details.risky > summary::-webkit-details-marker { display: none; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 28px 32px; margin-top: 36px; }
.stats div { border-top: 2px solid var(--ink); padding-top: 12px; }
.stats .kicker { display: block; margin-bottom: 6px; }
.stats b { display: block; font-family: var(--display); font-weight: 500; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats span { display: block; font-size: 0.92rem; margin-top: 4px; }
.stats small { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
.stats small .more { font-size: inherit; }

/* link list */
.links { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 32px; }
.links button { display: grid; gap: 4px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line-2); padding: 18px 0 22px; }
.links button b { font-family: var(--display); font-weight: 500; font-size: 1.3rem; }
.links button b::after { content: " →"; color: var(--accent); }
.links button:hover b { color: var(--accent); }
.links button span { color: var(--muted); font-size: 0.95rem; }

/* page header for guides */
.ph { padding-block: 48px 8px; }
.crumb { font-size: 0.9rem; color: var(--muted); margin-bottom: 14px; }
.crumb button { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.ph .lede { margin-top: 16px; max-width: 70ch; font-size: 1.08rem; }

/* tabs */
.tabs { position: sticky; top: calc(var(--toph, 61px) + env(safe-area-inset-top, 0px)); z-index: 20; background: #fff; border-bottom: 1px solid var(--line); margin-top: 28px; }
.tabs .wrap { display: flex; gap: 26px; overflow-x: auto; scrollbar-width: none; }
.tabs .wrap::-webkit-scrollbar { display: none; }
.tabs button { background: none; border: 0; padding: 14px 0 12px; color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; font-size: 0.97rem; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.panel { padding-block: 40px 72px; }
.block + .block, .rows + .block, p + .block { margin-top: 56px; }
.block > h2 { margin-bottom: 10px; }
.intro { color: var(--muted); max-width: 68ch; margin-bottom: 22px; }

/* simple people list */
.plist { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 40px; }
.plist > div { border-top: 1px solid var(--line); padding: 16px 0 18px; }
.plist .n { font-weight: 600; }
.plist .r { color: var(--muted); font-size: 0.92rem; margin-top: 2px; }
.plist .w { font-size: 0.92rem; margin-top: 6px; }

/* places */
.unit { border-top: 1px solid var(--line); }
.unit:last-child { border-bottom: 1px solid var(--line); }
.unit > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto 16px; gap: 6px 16px; padding: 16px 0; align-items: baseline; }
.unit > summary::-webkit-details-marker { display: none; }
.unit > summary .un { font-family: var(--display); font-size: 1.22rem; }
.unit > summary .uc { color: var(--muted); font-size: 0.88rem; white-space: nowrap; }
.unit > summary .ut { grid-column: 1 / -1; font-size: 0.86rem; color: var(--muted); }
.unit > summary .ut .alert { color: var(--warn); font-weight: 500; }
.unit > summary .chev { color: var(--muted); transition: transform .15s; }
.unit[open] > summary .chev { transform: rotate(90deg); }
.unit-body { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; padding: 4px 0 24px; }
table.mini { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
table.mini th, table.mini td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.mini th { font-weight: 500; color: var(--muted); font-size: 0.82rem; }
.incs { list-style: none; padding: 0; display: grid; gap: 12px; }
.incs li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; font-size: 0.93rem; }
.incs .d { color: var(--muted); font-variant-numeric: tabular-nums; }
.search { width: 100%; max-width: 420px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 4px; background: #fff; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 18px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 0.93rem; color: var(--muted); }
.note { font-size: 0.86rem; color: var(--muted); }
.gaps { columns: 2 260px; column-gap: 40px; padding-left: 1.1rem; }
.gaps li { margin-bottom: 8px; break-inside: avoid; }

/* India table */
.tablebox { overflow-x: auto; border-top: 2px solid var(--ink); -webkit-overflow-scrolling: touch; }
.tablebox table { border-collapse: collapse; width: 100%; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.tablebox th, .tablebox td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tablebox th { font-weight: 500; color: var(--muted); font-size: 0.8rem; vertical-align: bottom; }
.tablebox tr.grp th { text-align: left; color: var(--ink); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 0; padding-top: 14px; }
.tablebox .st { text-align: left; position: sticky; left: 0; background: #fff; z-index: 1; min-width: 150px; }
.tablebox tr.total td { font-weight: 600; border-top: 2px solid var(--ink); }
.tablebox td.na { color: #b5b0a5; }
.sortbtn { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: inherit; }
.grpbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; letter-spacing: inherit; text-transform: inherit; }
.sup { background: none; border: 0; padding: 0 0 0 2px; color: var(--accent); font-size: 0.75rem; vertical-align: super; }
.open-st { margin-left: 8px; font-size: 0.82rem; }
.srcs { margin-top: 18px; font-size: 0.85rem; color: var(--muted); }
.srcs ol { padding-left: 1.2rem; margin: 6px 0 10px; }
.srcs li.flash { background: #fff3b0; }

/* wins */
.lessons { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px 32px; margin-bottom: 40px; }
.lessons div { border-top: 2px solid var(--ink); padding-top: 12px; }
.lessons b { display: block; font-family: var(--display); font-size: 1.15rem; font-weight: 500; }
.lessons span { display: block; color: var(--muted); font-size: 0.93rem; margin-top: 4px; }
.win { display: grid; grid-template-columns: 64px minmax(0, 1fr) 110px; gap: 4px 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.win .yr { font-family: var(--display); font-size: 1.15rem; color: var(--muted); }
.win h3 { font-size: 1.18rem; }
.win .m { font-size: 0.86rem; color: var(--muted); margin-top: 2px; }
.win .lesson { margin-top: 6px; }
.win details summary { cursor: pointer; color: var(--accent); font-size: 0.9rem; margin-top: 6px; }
.win details p { margin-top: 6px; font-size: 0.93rem; }
.outc { font-size: 0.86rem; font-weight: 500; text-align: right; }
.outc.win-c { color: var(--good); } .outc.partial-c { color: #8a5a00; } .outc.lost-c { color: var(--warn); }

/* deciders */
.dec { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 40px; }
.dec article { border-top: 1px solid var(--line-2); padding: 20px 0 24px; }
.dec h3 { font-size: 1.25rem; }
.dec .ppl { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
.dec dl { margin: 12px 0 0; display: grid; gap: 8px; font-size: 0.93rem; }
.dec dt { font-weight: 600; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.dec dd { margin: 0; }
.routes { counter-reset: r; list-style: none; padding: 0; display: grid; gap: 14px; max-width: 720px; }
.routes li { counter-increment: r; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.routes li::before { content: counter(r); font-family: var(--display); font-size: 1.3rem; color: var(--accent); }
.routes b { display: block; font-weight: 600; }
.routes span { color: var(--muted); font-size: 0.95rem; }

/* sheet (intervention / tactic) */
.scrim { position: fixed; inset: 0; background: rgba(20, 20, 18, 0.38); z-index: 45; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: #fff; z-index: 50; overflow-y: auto; padding: calc(28px + env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(28px, env(safe-area-inset-left, 0px)); box-shadow: -12px 0 40px rgba(0,0,0,0.08); }
.sheet-top { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
.sheet h2 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); margin-top: 6px; }
.sheet .sh { font-size: 1.1rem; color: var(--muted); margin-top: 10px; }
.x { background: none; border: 1px solid var(--line-2); border-radius: 4px; padding: 6px 12px; font-size: 0.9rem; white-space: nowrap; }
.x:hover { border-color: var(--ink); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px 24px; margin-top: 24px; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.kv b { display: block; font-size: 0.76rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.kv span { font-size: 0.94rem; }
.first { margin-top: 24px; background: var(--cream); padding: 18px 20px; border-left: 3px solid var(--accent); }
.first b { display: block; font-size: 0.76rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.sec { margin-top: 36px; }
.sec > h3 { font-size: 1.35rem; margin-bottom: 10px; }
.sec > h3 .i { color: var(--muted); font-weight: 400; margin-right: 8px; }
.sec ul { padding-left: 1.15rem; display: grid; gap: 6px; }
.sec p + p { margin-top: 10px; }
.contacts { display: grid; gap: 0; }
.contacts > div { border-top: 1px solid var(--line); padding: 12px 0; font-size: 0.94rem; }
.contacts .tag { font-size: 0.72rem; letter-spacing: 0.07em; text-transform: uppercase; font-weight: 600; color: var(--good); display: block; }
.contacts .tag.s { color: var(--muted); }
.draft { border: 1px solid var(--line-2); border-radius: 4px; margin-top: 12px; }
.draft-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--cream); font-size: 0.92rem; }
.draft pre { margin: 0; padding: 14px; white-space: pre-wrap; word-wrap: break-word; font-family: var(--body); font-size: 0.9rem; line-height: 1.55; max-height: 340px; overflow-y: auto; }
.copy { background: #fff; border: 1px solid var(--line-2); border-radius: 4px; padding: 4px 12px; font-size: 0.86rem; }
.copy.done { border-color: var(--good); color: var(--good); }
.tacs { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.lens { font-size: 0.86rem; color: var(--muted); margin-top: 12px; }

/* sign-ups */
.signup { margin-top: 28px; border: 1px solid var(--line-2); border-radius: 4px; padding: 18px 20px; }
.signup h3 { font-size: 1.2rem; }
.signup .people { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
.signup .people li { font-size: 0.94rem; padding-left: 14px; border-left: 2px solid var(--accent); }
.signup .people .nm { font-weight: 600; }
.signup .people .you { font-size: 0.78rem; color: var(--good); margin-left: 6px; font-weight: 600; }
.signup form { display: grid; gap: 12px; margin-top: 14px; }
.signup label { display: grid; gap: 4px; font-size: 0.88rem; font-weight: 500; }
.signup input, .signup textarea { padding: 9px 11px; border: 1px solid var(--line-2); border-radius: 4px; background: #fff; font-weight: 400; }
.signup textarea { min-height: 64px; resize: vertical; }
.signup .acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.signup .err { color: var(--warn); font-size: 0.88rem; }

/* modal & picker */

  { id: "dl-cattle", title: "Stray cattle and the gosadans: get the numbers out", short: "About 80,000 cattle on the streets; five gosadans with room for 23,980.", animals: "Cows, bulls, calves", scale: "~80,000 stray cattle (2025 estimate); 5 gosadans, 23,980 places", lens: ["WF", "EA"], priority: "Medium",

    letter: { to: "To\nThe Hon'ble Minister for Development\nGovernment of NCT of Delhi\nDelhi Secretariat, I.P. Estate, New Delhi\n\nCopy to: The Secretary-cum-Development Commissioner, 5/9 Under Hill Road, Delhi 110054", subject: "Sub: Welfare in gosadans and the source of Delhi's stray cattle", body: "Respected Sir,\n\n1. About 80,000 cattle are estimated to roam Delhi's streets. The five gosadans have room for 23,980, and some have reported more animals than places.\n\n2. We request: (a) monthly publication of admissions, deaths and occupancy for each gosadan; (b) payments linked to welfare inspections; (c) enforcement of dairy licensing; (d) a plan for male calves.\n\nYours faithfully,\n[Name, address]\n[Date]" },

  { id: "dl-birdtrade", title: "Shut the illegal bird trade near Jama Masjid", short: "Raided in 2024 and again in 2026. It keeps coming back.", animals: "Parakeets, munias, other birds; rabbits, guinea pigs, mice", scale: "About 1,000 birds seized in 2024; 863 animals in 2026", lens: ["AB", "WF"], priority: "High",

  { id: "dl-manja", title: "Stop the manja season before it starts", short: "Every August, kites and pigeons are cut in their hundreds.", animals: "Black kites, pigeons, other birds", scale: "250+ birds in four days of August 2025; one vet saw 50–80 cases a day", lens: ["WAS", "WF"], priority: "Medium",

    asks: ["Police and Forest Department drives against manja sellers from early July", "A public list of bird rescue helplines before Independence Day", "School messages on cotton thread, through the Education Department"],

    contacts: ["forest", "pgms"],
    suggest: ["Joint Commissioner of Police (crime) for pre-season drives", "Director of Education, for a circular to schools"],
    email: { to: "Shri Manjinder Singh Sirsa, Hon'ble Minister for Environment, Forests & Wildlife", subject: "Early drive against banned manja before 15 August", body: "Respected Sir,\n\nEvery August Delhi's birds pay for kite fights. In four days before Independence Day 2025, rescue groups took in more than 250 birds cut by nylon or glass-coated manja, which is banned.\n\nWe request a drive against sellers from early July, a public list of bird rescue helplines, and a circular from the Education Department asking schools to promote cotton thread.\n\nYours faithfully,\n[Name]" },
    letter: { to: "To\nThe Principal Chief Conservator of Forests\nDepartment of Forests and Wildlife, Government of NCT of Delhi\n\nCopy to: The Hon'ble Minister for Forests & Wildlife; The Director of Education", subject: "Sub: Pre-season enforcement of the ban on synthetic and glass-coated manja", body: "Respected Sir/Madam,\n\n1. Rescue groups and vets report hundreds of birds injured by banned manja each August.\n\n2. We request: (a) drives against sellers from early July; (b) a published list of bird rescue helplines; (c) a circular to schools.\n\nYours faithfully,\n[Name, address]\n[Date]" },
    rti: [{ pio: "Public Information Officer, O/o the Commissioner of Police, Delhi (Crime Branch)", qs: ["Number of cases registered and quantity of synthetic or glass-coated manja seized in Delhi in 2024, 2025 and 2026, by month.", "Number of convictions in such cases since 2023."] }],
    watch: ["July: the window for pre-season drives", "15 August and Raksha Bandhan kite days"],
    src: [{ t: "The Week/PTI, 5 Aug 2025", u: "https://www.theweek.in/wire-updates/national/2025/08/05/des44-dl-chinese-manjha-birds.html" }],
    groups: ["wild"], scope: ["state"], first: "In June or July, send the e-mail and post the safe-kite caption.", time: "2 minutes to 30 minutes", skills: ["design", "social"], risk: "Low. Kite flying is loved; ask for cotton thread, not a kite ban.", measure: "Seizures in July, and fewer injured birds reported in August." },

  { id: "dl-ghazipur", title: "Ghazipur: open up the abattoir and the chicken market", short: "Delhi's only legal slaughterhouse and its biggest chicken market sit side by side.", animals: "Buffaloes, goats, sheep, chickens, fish", scale: "Delhi's only legal abattoir; the mandi was described in court as Delhi's largest chicken slaughter hub", lens: ["WF", "EA"], priority: "Medium",

    letter: { to: "To\nThe Commissioner\nMunicipal Corporation of Delhi\nDr. S.P. Mukherjee Civic Centre, Minto Road, New Delhi\n\nCopy to: The Chairman, Delhi Agricultural Marketing Board", subject: "Sub: Welfare standards at the Ghazipur abattoir and murga mandi", body: "Respected Sir,\n\n1. Ghazipur is Delhi's only legal abattoir, and the adjoining mandi is its largest chicken market.\n\n2. We request: (a) daily slaughter figures by species; (b) records of ante-mortem inspection under the Slaughter House Rules, 2001; (c) CCTV on slaughter lines; (d) enforcement of the 2018 High Court ban on bird slaughter in the mandi; (e) checks on transport vehicles.\n\nYours faithfully,\n[Name, address]\n[Date]" },

  { id: "dl-monkeys", title: "Monkeys: sterilise, don't just truck them away", short: "6,591 monkeys moved to Asola in five years, with no end in sight.", animals: "Rhesus macaques", scale: "6,591 relocated, 2021–2025", lens: ["WAS", "WF"], priority: "Medium",

  { id: "dl-horses", title: "Wedding horses: no spiked bits this season", short: "The wedding season is under way. Spiked bits are banned and still used.", animals: "Horses and ponies", scale: "Thousands of weddings each season", lens: ["WF", "AB"], priority: "Medium",

  { id: "dl-zoo", title: "Open up the Delhi zoo's death register", short: "Five of six tiger cubs, an elephant, antelopes: 2025 was a hard year.", animals: "Zoo animals", scale: "15–20 major deaths in 2025, by one estimate, besides birds", lens: ["WF", "AB"], priority: "Low",

/* ---------- 1. Documenting: a tactic, and what to record for each intervention ---------- */
TACTICS.unshift({ id: "document", name: "Document it properly", time: "30 minutes to ongoing", effort: 2,
  what: "Most wins started with evidence someone collected carefully: PETA India's report on Palamur Biosciences, PFA's tip-off on the Jama Masjid bird shops, AASRA's visits to Hyderabad's ABC centres. Officials and courts act on records, not outrage.",
  how: [
    "Photograph and film in public places only. Keep the phone's date, time and location on; don't edit the originals, and back them up the same day.",
    "Write down what you saw within the hour: date, time, exact place, number and kind of animals, their condition, vehicle numbers, names of shops or firms, and who else saw it.",
    "Get an expert on record: a vet's note on injuries, or a post-mortem for a poisoned animal. Keep the body cool and ask the vet to send samples to a forensic lab.",
    "Report it before posting it: file a police complaint under Section 11 of the PCA Act and the relevant sections of the BNS, and get the FIR or complaint number. If police refuse, write to the SP or DCP, or file a complaint before a magistrate.",
    "Use RTI to get the records only the government holds: inspection reports, licences, death registers, budgets. A pattern across months beats one bad day.",
    "Keep one folder per case: photos, notes, complaint numbers, replies and dates. Share it with a group or lawyer who can take it further."
  ],
  risk: "Never trespass, go undercover in farms, labs or slaughterhouses, or confront anyone. Investigations inside private premises are for trained organisations with lawyers. Blur faces of bystanders before you post.",
  src: "https://www.petaindia.com/blog/9-things-to-do-if-you-witness-cruelty-to-animals/" });

WINS.push(
  { y: "2014–2024", title: "Gadhimai: stopping animals crossing into Nepal for sacrifice", level: "Supreme Court; Bihar border", kind: "Enforcement", outcome: "partial",
    what: "In 2014 the Supreme Court directed the government to stop illegal transport of animals across the Nepal border for the Gadhimai sacrifice, and asked Humane World for Animals India (then HSI/India) and People for Animals to draw up an enforcement plan. In December 2024 their teams and border police saved more than 750 animals and ran door-to-door awareness in 12 border villages, yet an estimated 2.5 to 5 lakh animals were killed, about as many as in 2014 and 2019. Nepal's own 2019 court order to phase out sacrifice has been widely ignored.",
    lesson: "Rescue at a border saves hundreds; the killing is decided by demand and by the host government. Pair enforcement with work inside the community and the country where it happens.", src: "https://www.humaneworld.org/news-resources/mass-beheading-of-hundreds-of-thousands-of-animals-takes-place-at-nepals-gadhimai-festival-although-animal-groups-and-border-police-save-over-750-lucky-buffaloes-goats-pigeons-and-chickens/" },

  MK({ id: "in-fst", title: "Ask your university to drop the forced swim test", short: "Tamil Nadu's veterinary university stopped approving it in October 2026.", animals: "Mice and rats", scale: "Labs that test anti-depressants and stress", lens: ["WF", "AB"], priority: "Medium",

  MK({ id: "in-nams", title: "Ask how many drugs were cleared without animal tests", short: "Since 2023 India's drug rules allow organ-on-chip and other non-animal methods. Is anyone using them?", animals: "Dogs, monkeys, rabbits, rodents used in drug testing", scale: "Every new drug approved in India", lens: ["EA", "AB"], priority: "Medium",
    status: "Rules amended in March 2023; uptake not published", who: "PETA India and others pushed the amendment",
    why: "Until 2023, new drugs in India had to be tested on at least two animal species. The New Drugs and Clinical Trials Rules were amended in March 2023 to accept human-relevant methods such as organoids, organs-on-chips and computer models. A rule on paper changes nothing if regulators and companies don't use it. A count of how many applications relied on these methods tells everyone whether it is working.",

  MK({ id: "in-wedding-food", title: "Ask your caterer for a plant-based wedding or festival menu", short: "One family meal feeds hundreds. A caterer who learns it once offers it again.", animals: "Hens, chickens, goats, dairy animals", scale: "Hundreds of plates per event", lens: ["EA"], priority: "Medium",

  MK({ id: "in-snakes", title: "Report snakes used by snake charmers at Nag Panchami", short: "Snakes are protected; their mouths are often sealed and teeth broken. Report, don't confront.", animals: "Cobras and other snakes", scale: "Hundreds of snakes each Nag Panchami", lens: ["WF", "AB"], priority: "Medium",

  function riskSections(list) {
    let n = 0;

    return part("low") + part("med") + part("high");
  }
  function drawActs() {
    const broad = (a) => (a.groups || []).length > 3;
    const has = (a) => (a.groups || []).includes(todoGroup);
    const byPr = (a, b) => PR[b.priority] - PR[a.priority];
    const list = G.actions.filter((a) => todoGroup === "all" || (has(a) && !broad(a))).sort(byPr);
    const wide = todoGroup === "all" ? [] : G.actions.filter((a) => has(a) && broad(a)).sort(byPr);
    const nat = IN_ACTIONS.filter((a) => todoGroup === "all" ? false : has(a) && !broad(a));
    $$("[data-gf]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.gf === todoGroup));
    const gl = todoGroup === "all" ? "" : ((GROUPS.find((x) => x.id === todoGroup) || {}).l || "").toLowerCase();
    let html = list.length ? riskSections(list) : `<p class="muted" style="padding:18px 0">Nothing in ${esc(G.name)} is specifically about ${esc(gl)} yet. That is a gap; see "Who's working" for what nobody covers.</p>`;
    if (nat.length) html += `<h3 style="margin-top:32px;font-size:1.15rem">Anywhere in India</h3><div style="border-top:1px solid var(--line);margin-top:10px">${nat.map(actRow).join("")}</div>`;

    $("#alist").innerHTML = html;
    refreshWork();

  }
  const topbar = $(".top");
  const setTop = () => document.documentElement.style.setProperty("--toph", topbar.offsetHeight + "px");
  try { new ResizeObserver(setTop).observe(topbar); } catch (e) { addEventListener("resize", setTop); }
  setTop();
  document.documentElement.lang = "en-IN";
  window.addEventListener("hashchange", () => { route(); drawCredits(); });
  route();
})();
</script>
